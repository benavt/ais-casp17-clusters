name: Build and deploy reviewed saved publication
on:
  workflow_dispatch:
    inputs:
      manifest_sha256:
        description: SHA-256 of the approved config/publication.json on main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve the exact project dependency
        id: library
        run: |
          python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          deps = tomllib.loads(Path('pyproject.toml').read_text())['project']['dependencies']
          assert len(deps) == 1
          match = re.fullmatch(r'structure-clustering @ git\+https://github\.com/benavt/Structure_Clustering\.git@([0-9a-f]{40})', deps[0])
          assert match, 'An exact reviewed commit is required'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write('sha=' + match[1] + '\n')
          PY
      - name: Require read-only access to the private library
        env:
          LIBRARY_READ_TOKEN: ${{ secrets.STRUCTURE_CLUSTERING_READ_TOKEN }}
        run: test -n "$LIBRARY_READ_TOKEN"
      - uses: actions/checkout@v4
        with:
          repository: benavt/Structure_Clustering
          ref: ${{ steps.library.outputs.sha }}
          token: ${{ secrets.STRUCTURE_CLUSTERING_READ_TOKEN }}
          path: .dependencies/Structure_Clustering
          persist-credentials: false
          submodules: false
          sparse-checkout: |
            structure_clustering
            src
            scripts
            config
      - name: Install only the pinned portable library and project metadata
        run: |
          python -m pip install --no-deps .dependencies/Structure_Clustering
          python -m pip install --no-deps .
      - name: Bind this publication to the exact reviewed saved selection
        env:
          REVIEWED_MANIFEST: ${{ inputs.manifest_sha256 }}
        run: |
          python - <<'PY'
          import hashlib,os
          from pathlib import Path
          expected=os.environ['REVIEWED_MANIFEST']
          assert len(expected)==64
          assert hashlib.sha256(Path('config/publication.json').read_bytes()).hexdigest()==expected
          PY
      - run: structure-clustering check-privacy --tracked
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Rehydrate and export exact saved public artifacts
        run: python scripts/build_site.py
      - name: Check native file/path parity with the saved publication
        run: python scripts/check_site_parity.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
